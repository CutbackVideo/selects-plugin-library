          node plugins/archive-vlog/tests/fonts.test.cjs
          node plugins/archive-vlog/tests/i18n.test.cjs
          node plugins/archive-vlog/tests/look.test.cjs
          node plugins/archive-vlog/tests/motion.test.cjs
          node plugins/archive-vlog/tests/panel.test.cjs
          node plugins/archive-vlog/tests/planner.test.cjs
          node plugins/archive-vlog/tests/quick-score.test.cjs
          node plugins/archive-vlog/tests/scripts-edit.test.cjs
          node plugins/archive-vlog/tests/scripts-read.test.cjs
