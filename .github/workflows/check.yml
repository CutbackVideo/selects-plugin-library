name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/check_public.py
      - run: python3 tools/plugin_files.py check
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Place Count
        run: |
          node plugins/place-count/tests/core.test.cjs
          node plugins/place-count/tests/path-collision.test.cjs
          node plugins/place-count/tests/places.test.cjs
      - name: Test City Weekend Vlog
        run: |
          node plugins/city-weekend-vlog/tests/allocate.test.cjs
          node plugins/city-weekend-vlog/tests/beat-detect.test.cjs
          node plugins/city-weekend-vlog/tests/cues.test.cjs
          node plugins/city-weekend-vlog/tests/fonts.test.cjs
          node plugins/city-weekend-vlog/tests/motion.test.cjs
          node plugins/city-weekend-vlog/tests/panel.test.cjs
          node plugins/city-weekend-vlog/tests/planner.test.cjs
          node plugins/city-weekend-vlog/tests/scripts-edit.test.cjs
          node plugins/city-weekend-vlog/tests/scripts-read.test.cjs
          node plugins/city-weekend-vlog/tests/title.test.cjs
          node plugins/city-weekend-vlog/tests/warm.test.cjs
      - name: Test THE END Credits
        run: |
          node plugins/the-end-credits/tests/allocate.test.cjs
          node plugins/the-end-credits/tests/beat-detect.test.cjs
          node plugins/the-end-credits/tests/credits.test.cjs
          node plugins/the-end-credits/tests/cues.test.cjs
          node plugins/the-end-credits/tests/fonts.test.cjs
          node plugins/the-end-credits/tests/frame.test.cjs
          node plugins/the-end-credits/tests/graphic.test.cjs
          node plugins/the-end-credits/tests/look.test.cjs
          node plugins/the-end-credits/tests/panel.test.cjs
          node plugins/the-end-credits/tests/planner.test.cjs
          node plugins/the-end-credits/tests/scripts-edit.test.cjs
          node plugins/the-end-credits/tests/scripts-read.test.cjs
