name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/check_public.py
      - run: python3 tools/plugin_files.py check
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Place Count
        run: |
          node plugins/place-count/tests/core.test.cjs
          node plugins/place-count/tests/path-collision.test.cjs
          node plugins/place-count/tests/places.test.cjs
      - name: Test City Weekend Vlog
        run: |
          node plugins/city-weekend-vlog/tests/allocate.test.cjs
          node plugins/city-weekend-vlog/tests/beat-detect.test.cjs
          node plugins/city-weekend-vlog/tests/cues.test.cjs
          node plugins/city-weekend-vlog/tests/fonts.test.cjs
          node plugins/city-weekend-vlog/tests/motion.test.cjs
          node plugins/city-weekend-vlog/tests/panel.test.cjs
          node plugins/city-weekend-vlog/tests/planner.test.cjs
          node plugins/city-weekend-vlog/tests/scripts-edit.test.cjs
          node plugins/city-weekend-vlog/tests/scripts-read.test.cjs
          node plugins/city-weekend-vlog/tests/title.test.cjs
          node plugins/city-weekend-vlog/tests/warm.test.cjs
      - name: Test Mini Vlog
        run: |
          node plugins/mini-vlog/tests/allocate.test.cjs
          node plugins/mini-vlog/tests/beat-detect.test.cjs
          node plugins/mini-vlog/tests/cues.test.cjs
          node plugins/mini-vlog/tests/fonts.test.cjs
          node plugins/mini-vlog/tests/look.test.cjs
          node plugins/mini-vlog/tests/motion.test.cjs
          node plugins/mini-vlog/tests/panel.test.cjs
          node plugins/mini-vlog/tests/planner.test.cjs
          node plugins/mini-vlog/tests/punch.test.cjs
          node plugins/mini-vlog/tests/scripts-edit.test.cjs
          node plugins/mini-vlog/tests/scripts-read.test.cjs
          node plugins/mini-vlog/tests/scripts-types.test.cjs
          node plugins/mini-vlog/tests/title.test.cjs
      - name: Test Summer Trip
        run: |
          node plugins/summer-trip/tests/beat-detect.test.cjs
          node plugins/summer-trip/tests/cues.test.cjs
          node plugins/summer-trip/tests/muffle.test.cjs
          node plugins/summer-trip/tests/sfx.test.cjs
          node plugins/summer-trip/tests/effects.test.cjs
          node plugins/summer-trip/tests/motion.test.cjs
          node plugins/summer-trip/tests/planner.test.cjs
          node plugins/summer-trip/tests/allocate.test.cjs
          node plugins/summer-trip/tests/scripts-edit.test.cjs
          node plugins/summer-trip/tests/scripts-read.test.cjs
          node plugins/summer-trip/tests/title.test.cjs
          node plugins/summer-trip/tests/fonts.test.cjs
          node plugins/summer-trip/tests/panel.test.cjs
          node plugins/summer-trip/tests/package.test.cjs
          node plugins/summer-trip/tests/adapter.test.cjs
