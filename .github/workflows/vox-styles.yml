name: Vox style apps
on:
  pull_request:
    paths:
      - 'plugins/jared-vox-editorial/**'
      - 'plugins/tang-poetry-explainer/**'
      - 'tests/vox_styles*'
      - '.github/workflows/vox-styles.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/jared-vox-editorial/**'
      - 'plugins/tang-poetry-explainer/**'
      - 'tests/vox_styles*'
      - '.github/workflows/vox-styles.yml'
permissions:
  contents: read
jobs:
  portable-engine:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/vox_styles.test.mjs
