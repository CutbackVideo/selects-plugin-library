name: Publish catalog
# Publishes main's plugin manifests to the catalog the Selects app lists, so the
# app no longer lists this repository through GitHub's rate-limited API.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
# One publish at a time; a newer push supersedes a queued one.
concurrency:
  group: publish-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # The AWS role trusts only this environment, which deploys only from main.
    environment: catalog
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/plugin_files.py check
      - run: python3 tools/publish_catalog.py --commit "$GITHUB_SHA" --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3==1.40.*'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CATALOG_PUBLISH_ROLE_ARN }}
          aws-region: us-west-2
      - run: python tools/publish_catalog.py --commit "$GITHUB_SHA"
